services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caminhos
      POSTGRES_PASSWORD: caminhos
      POSTGRES_DB: caminhos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caminhos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
