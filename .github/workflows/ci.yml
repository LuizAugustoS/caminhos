name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: caminhos
          POSTGRES_PASSWORD: caminhos
          POSTGRES_DB: caminhos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caminhos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://caminhos:caminhos@localhost:5432/caminhos
      SESSION_SECRET: ci-apenas-para-testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm test
